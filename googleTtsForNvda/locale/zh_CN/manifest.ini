summary = "Google TTS For NVDA"
description = """通过受支持的 Chromium 内核浏览器运行时（如 Google Chrome、Microsoft Edge 或 Brave），在本地使用 Google WASM 文本转语音声音，作为 NVDA 的语音合成器。"""
changelog = """0.6 版本：
- 新增一项可选设置，以便从其他语音合成器切换回来时更快准备好 Google TTS。此设置默认关闭；启用后，NVDA 运行期间可能会占用更多内存。
- 启用此设置后，当您更改所选 Chromium 浏览器运行环境或安装/移除语音包时，Google TTS 会更新其后台准备状态。
- 提高了从 Google TTS 切换到其他语音合成器时的可靠性，尤其是在语音播放或语音准备尚未停止时。"""
